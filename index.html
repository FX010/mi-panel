<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Mi panel</title>
<style>
:root{--bg:#b6cbae;--panel:#fffbf5;--fg:#26211d;--muted:#645b52;--line:#e3d9cb;--accent:#9c3a1f;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14211c;--panel:#1f1815;--fg:#f2ebe3;--muted:#b3a69a;--line:#42352c;--accent:#e58a4e;--bad:#f08a82;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);background:linear-gradient(180deg,#8fb3a1 0%,var(--bg) 50%,#d9d0ae 100%);color:var(--fg);font:16px/1.45 "Segoe UI",system-ui,sans-serif;padding:1rem;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:linear-gradient(180deg,#14211c 0%,#1f2a22 55%,#2a2320 100%)}}
form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.6rem 1.5rem;width:min(100%,22rem);display:grid;gap:.85rem;box-shadow:0 8px 28px -10px rgba(40,25,15,.35)}
.kodama{width:84px;height:84px;justify-self:center}
h1{margin:0;font:600 1.6rem/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;text-align:center}
p{margin:0;color:var(--muted);font-size:.92rem;text-align:center}
input[type=password]{font:inherit;padding:.65rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:.65rem;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
label{font-size:.88rem;color:var(--muted)}#error{color:var(--bad);min-height:1.2em;font-size:.9rem;text-align:center}
@media (prefers-reduced-motion:no-preference){.kodama{animation:vaiven 4.5s ease-in-out infinite;transform-origin:50% 92%}@keyframes vaiven{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}}
</style></head><body>

<script>
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function llaveDe(clave, bloque) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(bloque.salt), iterations: bloque.it, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function abrirCon(llave, bloque) {
  const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(bloque.iv) }, llave, b64(bloque.ct));
  if (bloque.z === 'gzip') {
    if (typeof DecompressionStream === 'undefined') throw new Error('navegador-viejo');
    return new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  return new TextDecoder().decode(plano);
}
async function descifrar(clave, bloque) { return abrirCon(await llaveDe(clave, bloque), bloque); }
function saludoPara(hora) {
  return hora >= 6 && hora < 12 ? 'Buenos días' : hora >= 12 && hora < 20 ? 'Buenas tardes' : 'Buenas noches';
}
function saludoCon(texto, saludo) {
  const i = texto.indexOf(',');
  return i < 0 ? saludo : saludo + texto.slice(i);
}
function avisoDeFrescura(generado, ahoraMs, umbralMin) {
  if (typeof generado !== 'string') return '';
  const t = Date.parse(generado);
  if (isNaN(t)) return '';
  const min = (ahoraMs - t) / 60000;
  if (!(min >= umbralMin)) return '';
  const h = Math.floor(min / 60);
  const hace = h >= 48 ? Math.floor(h / 24) + ' días' : h + ' h';
  return 'Estos datos son de hace ' + hace + '. Si el PC está apagado o sin internet, los avisos de Telegram no salen ' +
    '(los recordatorios sonarán en el iPhone como respaldo).';
}
const bloque = JSON.parse(document.getElementById('datos').textContent);
const VIEJO = 'Tu navegador es muy antiguo para abrir el panel: actualízalo (iPhone con iOS 16.4 o más nuevo, Chrome, Edge o Firefox recientes).';
// La llave ya derivada se guarda en este dispositivo (IndexedDB) y el navegador no deja sacarla: nunca se guarda la contraseña.
function almacen() {
  return new Promise((ok, mal) => {
    const pedido = indexedDB.open('mi-panel', 1);
    pedido.onupgradeneeded = () => pedido.result.createObjectStore('llaves');
    pedido.onsuccess = () => ok(pedido.result);
    pedido.onerror = () => mal(pedido.error);
  });
}
async function usarLlaves(modo, hacer) {
  const db = await almacen();
  return new Promise((ok, mal) => {
    const tx = db.transaction('llaves', modo);
    const r = hacer(tx.objectStore('llaves'));
    tx.oncomplete = () => ok(r && r.result);
    tx.onerror = () => mal(tx.error);
  });
}
const llaveGuardada = () => usarLlaves('readonly', (s) => s.get(bloque.salt)).catch(() => null);
const guardarLlave = (llave) => usarLlaves('readwrite', (s) => s.put(llave, bloque.salt)).catch(() => null);
const olvidarLlave = () => usarLlaves('readwrite', (s) => s.delete(bloque.salt)).catch(() => null);
function mostrar(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.documentElement.replaceWith(doc.documentElement);
  try {
    const hora = new Date().getHours();
    const h1 = document.querySelector('main h1');
    if (h1) h1.textContent = saludoCon(h1.textContent, saludoPara(hora));
    const noche = document.getElementById('t-noche');
    if (noche && (hora >= 20 || hora < 6)) noche.checked = true;
    const m = document.querySelector('meta[name="generado"]');
    const aviso = avisoDeFrescura(m && m.content, Date.now(), 180);
    const principal = document.querySelector('main');
    if (aviso && principal) {
      const p = document.createElement('p');
      p.className = 'estado mal';
      p.setAttribute('role', 'alert');
      p.textContent = aviso;
      principal.insertBefore(p, principal.firstChild);
    }
  } catch (e3) {}
}
async function abrir(llave, recordar) {
  const html = await abrirCon(llave, bloque);
  if (recordar) await guardarLlave(llave);
  mostrar(html);
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const error = document.getElementById('error');
  try {
    await abrir(await llaveDe(document.getElementById('clave').value, bloque), document.getElementById('recordar').checked);
  } catch (e) {
    error.textContent = e && e.message === 'navegador-viejo' ? VIEJO : 'Contraseña incorrecta.';
  }
});
(async () => {
  if (!window.crypto || !crypto.subtle || !window.indexedDB) { document.getElementById('error').textContent = VIEJO; return; }
  let vieja = null;
  try { vieja = localStorage.getItem('panel-clave'); localStorage.removeItem('panel-clave'); } catch (e) {}
  try {
    if (vieja) { await abrir(await llaveDe(vieja, bloque), true); return; }     // la contraseña guardada antes: se pasa a llave y se borra
    const llave = await llaveGuardada();
    if (llave) await abrir(llave, false);
  } catch (e) { await olvidarLlave(); }
})();
</script></body></html>
