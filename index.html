<style>
:root{--bg:#f6f5f2;--panel:#fff;--fg:#1d2327;--muted:#5f6b73;--line:#e1ddd5;--accent:#1f6f78;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14181a;--panel:#1c2225;--fg:#e8ecee;--muted:#98a4ab;--line:#2c3539;--accent:#59b6c0;--bad:#f08a82;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.45 "Segoe UI",system-ui,sans-serif;padding:1rem}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.5rem;width:min(100%,22rem);display:grid;gap:.8rem}
h1{margin:0;font-size:1.3rem}p{margin:0;color:var(--muted);font-size:.9rem}
input[type=password]{font:inherit;padding:.6rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:.6rem;border:0;border-radius:6px;background:var(--accent);color:var(--bg);cursor:pointer}
label{font-size:.85rem;color:var(--muted)}#error{color:var(--bad);min-height:1.2em;font-size:.9rem}
</style></head><body>

<script>
async function descifrar(clave, bloque) {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const llave = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(bloque.salt), iterations: bloque.it, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(bloque.iv) }, llave, b64(bloque.ct));
  return new TextDecoder().decode(plano);
}
const bloque = JSON.parse(document.getElementById('datos').textContent);
async function abrir(clave, recordar) {
  try {
    const html = await descifrar(clave, bloque);
    try { if (recordar) localStorage.setItem('panel-clave', clave); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { localStorage.removeItem('panel-clave'); } catch (e2) {}
    document.getElementById('error').textContent = 'Contraseña incorrecta.';
  }
}
document.getElementById('f').addEventListener('submit', (ev) => {
  ev.preventDefault();
  abrir(document.getElementById('clave').value, document.getElementById('recordar').checked);
});
try { const g = localStorage.getItem('panel-clave'); if (g) abrir(g, true); } catch (e) {}
</script></body></html>
