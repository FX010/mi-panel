<script>
async function descifrar(clave, bloque) {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const llave = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(bloque.salt), iterations: bloque.it, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(bloque.iv) }, llave, b64(bloque.ct));
  return new TextDecoder().decode(plano);
}
const bloque = JSON.parse(document.getElementById('datos').textContent);
async function abrir(clave, recordar) {
  try {
    const html = await descifrar(clave, bloque);
    try { if (recordar) localStorage.setItem('panel-clave', clave); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { localStorage.removeItem('panel-clave'); } catch (e2) {}
    document.getElementById('error').textContent = 'Contraseña incorrecta.';
  }
}
document.getElementById('f').addEventListener('submit', (ev) => {
  ev.preventDefault();
  abrir(document.getElementById('clave').value, document.getElementById('recordar').checked);
});
try { const g = localStorage.getItem('panel-clave'); if (g) abrir(g, true); } catch (e) {}
</script></body></html>
